<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackHole — Orch Aerospace, Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05070c;color:#e8edf3;
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    background:radial-gradient(900px 520px at 50% 0%,rgba(255,182,97,.08),transparent 60%),#05070c}
  .c{min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:40px}
  .ring{width:46px;height:46px;border-radius:50%;border:1px solid #8cf2ff;position:relative;margin-bottom:22px}
  .ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  h1{font-weight:300;letter-spacing:6px;font-size:30px;margin:0 0 6px}
  p{color:#9aa6bb;font-weight:300;margin:.3em 0}
  a{color:#8cf2ff;text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:14px;
    border:1px solid rgba(140,242,255,.35);border-radius:10px;padding:9px 16px;margin-top:18px;display:inline-block}
  a:hover{border-color:#8cf2ff}
</style>
</head>
<body><div class="c">
  <div class="ring"></div>
  <h1>BLACKHOLE</h1>
  <p>Real-time relativistic black-hole simulator</p>
  <p>by Orch Aerospace, Inc.</p>

</div></body>
